<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID Mechanism Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
  <div class="app">
    <div class="sidebar">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border-tertiary);">
        <h1 style="margin: 0; font-size: 16px; font-weight: 600;">PID Simulator</h1>
        <button id="darkModeToggle" class="dark-mode-btn" title="Toggle dark mode">🌙</button>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Simulation</div>
          <button class="collapse-btn" data-section="simulation">−</button>
        </div>
        <div class="section-content" id="simulation">
          <div class="row2">
            <div class="field"><label for="targetInput">Target position (cm)</label><input type="number" id="targetInput" value="100" step="1" min="1" max="300"></div>
            <div class="field"><label for="simTime">Duration (s)</label><input type="number" id="simTime" value="3" step="0.5" min="0.5"></div>
            <div class="field"><label for="dt">Looptime (ms)</label><input type="number" id="dt" value="26" step="1" min="1"></div>
            <div class="field"><label for="loopVariance">Loop variation (ms)</label><input type="number" id="loopVariance" value="0" step="1" min="0" max="100"></div>
          </div>
          <button class="run-btn" id="runBtn">Run simulation</button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">PID controllers</div>
          <button class="collapse-btn" data-section="controllers">−</button>
        </div>
        <div class="section-content" id="controllers">
          <div id="ctrlList"></div>
          <button class="add-btn" id="addCtrlButton">+ add controller</button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Mechanism</div>
          <button class="collapse-btn" data-section="mechanism">−</button>
        </div>
        <div class="section-content" id="mechanism">
          <div class="row2">
            <div class="field"><label for="mass">Mass (kg)</label><input type="number" id="mass" value="1.2" step="0.1"></div>
            <div class="field"><label for="ratio">Gear ratio</label><input type="number" id="ratio" value="0.2" step="0.01"></div>
            <div class="field"><label for="spoolR">Spool radius (m)</label><input type="number" id="spoolR" value="0.02" step="0.001"></div>
            <div class="field"><label for="fricCoeff">Friction coeff μ</label><input type="number" id="fricCoeff" value="0.5" step="0.05"></div>
          </div>
          <div class="row2">
            <div class="field checkbox-field">
              <label for="cascadeRigging" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="cascadeRigging" style="margin: 0;">
                Cascade rigging
              </label>
            </div>
            <div class="field" id="stagesField" style="display: none;"><label for="stages">Number of stages</label><input type="number" id="stages" value="2" step="1" min="2" max="10"></div>
            <div class="field"><label for="counterSpring">Counterspring force (N)</label><input type="number" id="counterSpring" value="0" step="0.1" min="0"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Motors</div>
          <button class="collapse-btn" data-section="motor">−</button>
        </div>
        <div class="section-content" id="motor">
          <div class="row2">
            <div class="field"><label for="motorCount">Count</label><input type="number" id="motorCount" value="2" min="1" max="6" step="1"></div>
            <div class="field"><label for="maxV">Max voltage (V)</label><input type="number" id="maxV" value="12" step="0.5"></div>
            <div class="field"><label for="stallTorque">Stall torque (Nm)</label><input type="number" id="stallTorque" value="0.19" step="0.01"></div>
            <div class="field"><label for="freeRPM">Free speed (RPM)</label><input type="number" id="freeRPM" value="5900" step="100"></div>
            <div class="field"><label for="stallCurrent">Stall current (A)</label><input type="number" id="stallCurrent" value="11" step="0.5"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="legend-wrap" id="legend"></div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
      <div class="status-bar" id="status">Configure controllers and press run.</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
