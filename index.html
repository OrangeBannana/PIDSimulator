<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID Simulator Suite</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-badge">PID</div>
      <div>
        <div class="logo-text">SIMULATOR SUITE</div>
        <div class="logo-sub">Explore and compare control system simulators</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="darkModeToggle" class="btn" onclick="document.body.classList.toggle('light-mode')">🌙</button>
    </div>
  </header>
  <main>
    <div class="landing-container">
      <h1 class="landing-title">PID Simulator Suite</h1>
      <p class="landing-desc">Select a simulator to begin exploring control systems.</p>
      <div class="simulator-grid">
        <div class="simulator-card" onclick="window.location.href='linear.html'">
          <div class="simulator-title">Linear System Simulator</div>
          <div class="simulator-desc">Simulate and tune PID control for a linear mechanism.</div>
        </div>
        <!-- Future simulators can be added here as more cards -->
      </div>
    </div>
  </main>
  </body>
</html>
