
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); color: var(--color-text-primary); }
.app { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: 600px; }
.sidebar { border-right: 0.5px solid var(--color-border-tertiary); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; }
.section-title { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 12px; color: var(--color-text-secondary); }
.field input[type=number] { font-size: 13px; padding: 5px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctrl-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px; position: relative; }
.ctrl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ctrl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ctrl-name-input { font-size: 13px; font-weight: 500; border: none; background: transparent; color: var(--color-text-primary); width: 100%; outline: none; }
.ctrl-name-input:focus { border-bottom: 1px solid var(--color-border-primary); }
.ctrl-gains { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
.gain-field { display: flex; flex-direction: column; gap: 2px; }
.gain-field label { font-size: 10px; color: var(--color-text-secondary); font-weight: 500; }
.gain-field input { font-size: 12px; padding: 4px 6px; border: 0.5px solid var(--color-border-tertiary); border-radius: 6px; background: var(--color-background-secondary); color: var(--color-text-primary); width: 100%; }
.remove-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--color-text-secondary); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
.remove-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.add-btn { background: none; border: 0.5px dashed var(--color-border-secondary); color: var(--color-text-secondary); font-size: 12px; padding: 7px; border-radius: var(--border-radius-md); cursor: pointer; width: 100%; }
.add-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.run-btn { background: var(--color-background-primary); border: 0.5px solid var(--color-border-primary); color: var(--color-text-primary); font-size: 13px; font-weight: 500; padding: 9px; border-radius: var(--border-radius-md); cursor: pointer; width: 100%; transition: background 0.1s; }
.run-btn:hover { background: var(--color-background-secondary); }
.run-btn:active { transform: scale(0.98); }
.run-btn.running { color: var(--color-text-danger); border-color: var(--color-border-danger); }
.target-row { display: flex; align-items: center; gap: 10px; }
.target-row label { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
.target-row input { flex: 1; font-size: 13px; padding: 5px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
.target-row span { font-size: 12px; color: var(--color-text-secondary); }
.chart-wrap { position: relative; flex: 1; min-height: 360px; }
.legend-wrap { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--color-text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 12px; height: 3px; border-radius: 2px; }
.status-bar { font-size: 11px; color: var(--color-text-secondary); min-height: 16px; }
</style>

<div class="app">
  <div class="sidebar">
    <div class="section">
      <div class="section-title">Target position</div>
      <div class="target-row">
        <label>Position</label>
        <input type="number" id="target" value="100" step="1" min="1" max="300">
        <span>cm</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">System — motor</div>
      <div class="row2">
        <div class="field"><label>Count</label><input type="number" id="motorCount" value="2" min="1" max="6" step="1"></div>
        <div class="field"><label>Max voltage (V)</label><input type="number" id="maxV" value="12" step="0.5"></div>
        <div class="field"><label>Stall torque (Nm)</label><input type="number" id="stallTorque" value="0.19" step="0.01"></div>
        <div class="field"><label>Free speed (RPM)</label><input type="number" id="freeRPM" value="5900" step="100"></div>
        <div class="field"><label>Stall current (A)</label><input type="number" id="stallCurrent" value="11" step="0.5"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">System — mechanism</div>
      <div class="row2">
        <div class="field"><label>Mass (kg)</label><input type="number" id="mass" value="1.2" step="0.1"></div>
        <div class="field"><label>Gear ratio</label><input type="number" id="ratio" value="0.2" step="0.01"></div>
        <div class="field"><label>Spool radius (m)</label><input type="number" id="spoolR" value="0.02" step="0.001"></div>
        <div class="field"><label>Friction coeff μ</label><input type="number" id="fricCoeff" value="0.5" step="0.05"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">PID controllers</div>
      <div id="ctrlList" style="display:flex;flex-direction:column;gap:8px;"></div>
      <button class="add-btn" onclick="addController()" style="margin-top:8px;">+ add controller</button>
    </div>

    <div class="section">
      <div class="section-title">Simulation</div>
      <div class="row2" style="margin-bottom:8px;">
        <div class="field"><label>Duration (s)</label><input type="number" id="simTime" value="3" step="0.5" min="0.5"></div>
        <div class="field"><label>Time step (ms)</label><input type="number" id="dt" value="26" step="1" min="1"></div>
      </div>
      <button class="run-btn" id="runBtn" onclick="toggleRun()">Run simulation</button>
    </div>
  </div>

  <div class="main">
    <div class="legend-wrap" id="legend"></div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
    <div class="status-bar" id="status">Configure controllers and press run.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const COLORS = ['#3B82F6','#EF4444','#10B981','#F59E0B','#8B5CF6','#EC4899','#14B8A6','#F97316'];
let controllers = [];
let chart = null;
let animFrame = null;
let isRunning = false;
let simState = null;

function getVal(id) { return parseFloat(document.getElementById(id).value) || 0; }

function addController(p=0.014, i=0, d=0.00082, f=0.10, name='') {
  const id = Date.now();
  const idx = controllers.length;
  const color = COLORS[idx % COLORS.length];
  const nm = name || 'PID ' + (idx+1);
  controllers.push({ id, color, name: nm, p, i, d, f, integral: 0, prevErr: 0 });
  renderControllers();
  rebuildChart();
}

function removeController(id) {
  controllers = controllers.filter(c => c.id !== id);
  renderControllers();
  rebuildChart();
}

function renderControllers() {
  const list = document.getElementById('ctrlList');
  list.innerHTML = '';
  controllers.forEach((c, idx) => {
    c.color = COLORS[idx % COLORS.length];
    const div = document.createElement('div');
    div.className = 'ctrl-card';
    div.innerHTML = `
      <div class="ctrl-header">
        <div class="ctrl-dot" style="background:${c.color}"></div>
        <input class="ctrl-name-input" value="${c.name}" onchange="controllers[${idx}].name=this.value;rebuildChart()">
      </div>
      <div class="ctrl-gains">
        <div class="gain-field"><label>Kp</label><input type="number" value="${c.p}" step="0.001" onchange="controllers[${idx}].p=parseFloat(this.value)||0"></div>
        <div class="gain-field"><label>Ki</label><input type="number" value="${c.i}" step="0.0001" onchange="controllers[${idx}].i=parseFloat(this.value)||0"></div>
        <div class="gain-field"><label>Kd</label><input type="number" value="${c.d}" step="0.0001" onchange="controllers[${idx}].d=parseFloat(this.value)||0"></div>
        <div class="gain-field"><label>Kf</label><input type="number" value="${c.f}" step="0.01" onchange="controllers[${idx}].f=parseFloat(this.value)||0"></div>
      </div>
      <button class="remove-btn" onclick="removeController(${c.id})">✕</button>`;
    list.appendChild(div);
  });
  renderLegend();
}

function renderLegend() {
  const leg = document.getElementById('legend');
  leg.innerHTML = controllers.map(c =>
    `<div class="legend-item"><div class="legend-dot" style="background:${c.color}"></div><span>${c.name}</span></div>`
  ).join('') + `<div class="legend-item"><div class="legend-dot" style="background:#888;opacity:0.6;border-top:2px dashed #888;height:0;margin-top:1px"></div><span>target</span></div>`;
}

function rebuildChart() {
  const ctx = document.getElementById('chart');
  if (chart) { chart.destroy(); chart = null; }
  const datasets = controllers.map(c => ({
    label: c.name,
    data: [],
    borderColor: c.color,
    backgroundColor: 'transparent',
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.2
  }));
  datasets.push({
    label: 'target',
    data: [],
    borderColor: '#888',
    borderDash: [5,4],
    borderWidth: 1.5,
    pointRadius: 0,
    tension: 0
  });
  chart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'time (s)', font: { size: 11 }, color: '#888' },
          ticks: { font: { size: 11 }, color: '#888', maxTicksLimit: 10,
            callback: v => v.toFixed(2) },
          grid: { color: 'rgba(128,128,128,0.12)' }
        },
        y: {
          title: { display: true, text: 'position (cm)', font: { size: 11 }, color: '#888' },
          ticks: { font: { size: 11 }, color: '#888', callback: v => v.toFixed(1) },
          grid: { color: 'rgba(128,128,128,0.12)' }
        }
      }
    }
  });
  renderLegend();
}

function getMotor() {
  const maxV = getVal('maxV'), freeRPM = getVal('freeRPM'), stallCurrent = getVal('stallCurrent');
  const kt = maxV / ((freeRPM * 2 * Math.PI) / 60);
  const R = maxV / stallCurrent;
  const count = getVal('motorCount');
  return {
    kt, R, count,
    getTorque(v, omega) { return (kt * (v - kt * omega) / R) * count; }
  };
}

function getMech() {
  const mass = getVal('mass'), ratio = getVal('ratio'), spoolR = getVal('spoolR');
  const fricCoeff = getVal('fricCoeff'), g = -9.81;
  const kineticFric = fricCoeff * Math.abs(g) * mass * spoolR;
  return {
    mass, ratio, spoolR, g, kineticFric,
    getInertia() { return mass * spoolR * spoolR; },
    getGravityTorque() { return g * mass * spoolR; },
    getLinearPos(angPos) { return ((angPos / (2*Math.PI)) * ratio) * 2*Math.PI * spoolR * 100; }
  };
}

function pidCalc(ctrl, state, mech, targetCm) {
  const dt = getVal('dt') / 1000;
  const TICKS_PER_REV = 28;
  const targetTicks = TICKS_PER_REV * ((targetCm / (2*Math.PI*mech.spoolR*100)) / mech.ratio);
  const currTicks = (state.pos / (2*Math.PI)) * TICKS_PER_REV;
  const err = targetTicks - currTicks;
  const deriv = (err - ctrl.prevErr) / dt;
  ctrl.integral += err * dt;
  let v = (err*ctrl.p + ctrl.integral*ctrl.ki + deriv*ctrl.d + ctrl.f) * 12;
  v = Math.min(Math.max(v, -12), 12);
  ctrl.prevErr = err;
  return v;
}

function initSim() {
  const dt = getVal('dt') / 1000;
  const motor = getMotor();
  const mech = getMech();
  const target = getVal('target');
  const totalTime = getVal('simTime');
  const states = controllers.map(() => ({ pos: 0, vel: 0, t: 0 }));
  controllers.forEach(c => { c.integral = 0; c.prevErr = 0; c.ki = c.i; });
  return { dt, motor, mech, target, totalTime, states, done: false, step: 0 };
}

function stepBatch(n=80) {
  if (!simState || simState.done) return;
  const { dt, motor, mech, target } = simState;
  for (let s = 0; s < n; s++) {
    let allDone = true;
    for (let ci = 0; ci < controllers.length; ci++) {
      const st = simState.states[ci];
      if (st.t >= simState.totalTime) continue;
      allDone = false;
      const c = controllers[ci];
      const v = pidCalc(c, st, mech, target);
      const torqueMotor = motor.getTorque(v, st.vel);
      const torqueLoad = (torqueMotor / mech.ratio) + mech.getGravityTorque();
      const netT = torqueLoad - (Math.sign(st.vel) * mech.kineticFric);
      const acc = netT / mech.getInertia();
      st.pos += dt * st.vel;
      st.vel += acc * dt;
      st.t += dt;
      chart.data.datasets[ci].data.push({ x: +st.t.toFixed(4), y: +mech.getLinearPos(st.pos).toFixed(3) });
    }
    const tMax = Math.max(...simState.states.map(s => s.t));
    const lastTargetX = chart.data.datasets[controllers.length].data;
    if (lastTargetX.length === 0 || tMax - lastTargetX[lastTargetX.length-1].x > dt*5) {
      chart.data.datasets[controllers.length].data.push({ x: +tMax.toFixed(4), y: target });
    }
    if (allDone) { simState.done = true; break; }
  }
  autoScaleY();
  chart.update('none');
  const pct = Math.round((Math.max(...simState.states.map(s=>s.t)) / simState.totalTime)*100);
  document.getElementById('status').textContent = simState.done ? 'Simulation complete.' : `Simulating... ${pct}%`;
  if (!simState.done) { animFrame = requestAnimationFrame(() => stepBatch(80)); }
  else { stopRun(); }
}

function autoScaleY() {
  const targetY = getVal('target');
  let allY = [targetY];
  for (let ci = 0; ci < controllers.length; ci++) {
    chart.data.datasets[ci].data.forEach(p => allY.push(p.y));
  }
  const mn = Math.min(...allY), mx = Math.max(...allY);
  const pad = Math.max((mx - mn) * 0.15, 2);
  chart.options.scales.y.min = +(mn - pad).toFixed(1);
  chart.options.scales.y.max = +(mx + pad).toFixed(1);
}

function toggleRun() {
  if (isRunning) { stopRun(); return; }
  if (controllers.length === 0) { document.getElementById('status').textContent = 'Add at least one PID controller first.'; return; }
  isRunning = true;
  document.getElementById('runBtn').textContent = 'Stop';
  document.getElementById('runBtn').classList.add('running');
  rebuildChart();
  simState = initSim();
  const tgt = getVal('target');
  const total = getVal('simTime');
  chart.data.datasets[controllers.length].data = [{x:0,y:tgt},{x:total,y:tgt}];
  chart.options.scales.x.min = 0;
  chart.options.scales.x.max = total;
  animFrame = requestAnimationFrame(() => stepBatch(80));
}

function stopRun() {
  isRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  document.getElementById('runBtn').textContent = 'Run simulation';
  document.getElementById('runBtn').classList.remove('running');
}

document.getElementById('target').addEventListener('input', function() {
  if (!chart) return;
  const tgt = parseFloat(this.value) || 0;
  const total = getVal('simTime');
  chart.data.datasets[controllers.length].data = [{x:0,y:tgt},{x:total,y:tgt}];
  autoScaleY();
  chart.update('none');
});

addController(0.014, 0, 0.00082, 0.10, 'Tuned PID');
rebuildChart();
</script>
